<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBD Logger</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f2f2f2;--line:#ddd;--acc:#078a5c;--bad:#c33;--warn:#a36b00}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1c1c1c;--line:#333;--acc:#2fc48d;--bad:#ff6b6b;--warn:#e0b040}}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px 40px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:18px;margin:4px 0 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 6px}
.card{background:var(--card);border-radius:10px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 auto;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-weight:600}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.4}
input,select{min-height:44px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=text]{flex:1 1 140px;font-family:ui-monospace,monospace;text-transform:uppercase}
#status{font-size:13px;color:var(--mut);margin-bottom:8px}
#status.ok{color:var(--acc)}#status.bad{color:var(--bad)}
.big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:13px}
#log{font:12px/1.35 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto;margin:0}
#log .bad{color:var(--bad)}#log .warn{color:var(--warn)}
label{display:flex;align-items:center;gap:6px;font-size:14px}
.note{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<h1>OBD Logger Landing Page </h1>
<a href="/obd-logger.html">GoTo app</a>
</body>
</html>
